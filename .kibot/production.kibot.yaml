kibot:
  version: 1

global:
  filters:
    - name: 'exclude_dnp'
      comment: 'Exclude DNP components'
      type: 'generic'
      exclude_dnp: true

outputs:
  # Gerber files for JLCPCB
  - name: 'gerbers'
    comment: 'Gerbers for JLCPCB'
    type: 'gerber'
    dir: 'jlcpcb/gerbers'
    options:
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: true
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: false
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: true
      create_gerber_job_file: false
      disable_aperture_macros: true
      gerber_precision: 4.6
      use_gerber_x2_attributes: false
      use_gerber_net_attributes: false
      line_width: 0.1
      subtract_mask_from_silk: true
    layers:
      - F.Cu
      - B.Cu
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts
      
  # Drill files for JLCPCB
  - name: 'drill'
    comment: 'Drill files for JLCPCB'
    type: 'excellon'
    dir: 'jlcpcb/gerbers'
    options:
      pth_and_npth_single_file: false
      pth_id: '-PTH'
      npth_id: '-NPTH'
      metric_units: true
      map: gerber
      route_mode_for_oval_holes: false
      
  # Pick and Place for JLCPCB
  - name: 'position'
    comment: 'Pick and place file for JLCPCB'
    type: 'position'
    dir: 'jlcpcb'
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: true
      output: '%f_cpl_jlc.%x'
      
  # BOM for JLCPCB
  - name: 'bom'
    comment: 'BOM for JLCPCB'
    type: 'bom'
    dir: 'jlcpcb'
    options:
      output: '%f_bom_jlc.%x'
      format: CSV
      columns:
        - field: 'Reference'
          name: 'Designator'
        - field: 'Value'
          name: 'Comment'
        - field: 'Footprint'
          name: 'Footprint'
        - field: 'LCSC'
          name: 'LCSC Part Number'
          
  # ZIP file for JLCPCB
  - name: 'jlcpcb_zip'
    comment: 'ZIP file for JLCPCB'
    type: 'compress'
    dir: 'jlcpcb'
    options:
      files:
        - source: 'jlcpcb/gerbers/*'
        - source: 'jlcpcb/%f_cpl_jlc.csv'
        - source: 'jlcpcb/%f_bom_jlc.csv'
      output: '%f_jlcpcb.zip'
